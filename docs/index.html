<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../favicon.ico?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icon-192.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png?v=2">
    <link rel="manifest" href="../manifest.webmanifest?v=2">
    <meta name="apple-mobile-web-app-title" content="Speakeasy" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <script src="docs-theme-loader.js"></script>

    

    <title>User Guide — Speakeasy</title>
    <meta name="description" content="Learn how to use Speakeasy with helpful guides explaining what's available.">
    <link rel="canonical" href="https://speakeasy.ryanmarch.me/docs/">

    <!-- Docs Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <script src="docs-components.js" type="module"></script>
</head>

<body class="user-docs-page docs-home-page">
    <div class="app-container">
        <!-- Mobile Navigation Overlay -->
        <div id="mobile-overlay" class="mobile-overlay"></div>

        <main class="page-container-fullwidth user-docs">
            <!-- Sidebar Navigation (visible only on mobile) -->
            <docs-sidebar></docs-sidebar>

            <!-- Right-side Content & Header Wrapper -->
            <div class="page-content-wrapper">
                <docs-header></docs-header>

                <!-- Content Area -->
                <docs-anchor-helper>
                    <div class="docs-hero">
                        <h1>Help Center</h1>
                        <p class="lead">Search guides, explore features, and learn how to use Speakeasy.</p>
                        <docs-search></docs-search>
                    </div>

                    <h2 class="docs-categories-title">Explore Guides</h2>

                    <docs-grid></docs-grid>

                </docs-anchor-helper>
            </div>
        </main>

        <!-- Footer -->
        <docs-footer></docs-footer>

        <!-- Lightbox Modal -->
        <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true" role="dialog" aria-label="Image Viewer">
            <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
            <img class="lightbox-content" id="lightbox-img" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>
</body>

</html>
