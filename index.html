<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speakeasy: Cocktail Recipe Library</title>
  <meta name="description" content="Cocktail recipe library with interactive fluid layers and instant spec parsing.">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Speakeasy">
  <meta name="theme-color" content="#121110">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/base.css?v=15">
  <link rel="stylesheet" href="css/index.css?v=21">
  <!-- Preload the ES module graph so the browser fetches it in parallel instead of
       discovering each import one-by-one as app.js's static imports are parsed. -->
  <link rel="modulepreload" href="app.js?v=13">
  <link rel="modulepreload" href="js/modules/storage.js">
  <link rel="modulepreload" href="js/modules/parser.js">
  <link rel="modulepreload" href="js/modules/colors.js">
  <link rel="modulepreload" href="js/modules/taxonomy.js">
  <link rel="modulepreload" href="js/modules/glass-view.js">
  <link rel="modulepreload" href="js/modules/abv.js">
  <link rel="modulepreload" href="js/modules/glassware.js">
  <link rel="modulepreload" href="js/modules/garnishes.js">
</head>

<body>
  <div id="app">
    <!-- Main Header -->
    <header class="app-header">
      <button type="button" id="btn-go-home" class="brand-group brand-group-btn" title="Go to Home" aria-label="Go to Home">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M8 22h8" />
          <path d="M12 11v11" />
          <path d="m19 3-7 8-7-8Z" />
        </svg>
        <div>
          <h1 class="brand-title">Speakeasy</h1>
          <div class="brand-subtitle">Cocktail Recipe Library</div>
        </div>
      </button>

      <div class="header-actions">
        <button id="btn-my-bar" class="btn btn-secondary btn-sm my-bar-btn"
          title="Manage your personal backbar inventory">
          <span class="btn-text">My Bar</span> <span id="my-bar-badge">0</span>
        </button>
        <button id="btn-new-drink" class="btn btn-primary btn-sm new-drink-btn" title="Create a new cocktail recipe">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="btn-text">New Drink</span>
        </button>
        <button id="btn-vault-menu" class="btn btn-secondary btn-sm vault-menu-btn" popovertarget="vault-popover"
          title="Settings">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
          <span class="btn-text">Settings</span>
          <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" aria-hidden="true">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </button>
        <input type="file" id="import-file-input" accept=".json,application/json" style="display: none;"
          aria-label="Upload JSON recipes file">
      </div>
    </header>

    <!-- Vault & App Settings Popover -->
    <div id="vault-popover" popover="auto" class="vault-popover">
      <div class="vault-popover-header">
        <div class="vault-identity-avatar" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 22h8"></path>
            <path d="M12 11v11"></path>
            <path d="m19 3-7 8-7-8Z"></path>
          </svg>
        </div>
        <div class="vault-identity-text">
          <div class="vault-name-row">
            <input type="text" id="vault-bar-name-input" class="vault-bar-name-input" value="Speakeasy Vault"
              maxlength="32" title="Click to rename your bar" aria-label="Bar name">
            <svg class="vault-edit-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" aria-hidden="true">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
            </svg>
          </div>
          <div class="vault-stats-line" id="vault-stats-line">0 custom cocktails · 0 ingredients</div>
        </div>
      </div>

      <div class="vault-popover-body">
        <!-- Section: Unit Preference -->
        <div class="vault-section">
          <div class="vault-section-title">Units & Measures</div>
          <div class="vault-unit-toggle" role="group" aria-label="Measurement units preference">
            <button type="button" id="popover-unit-oz" class="vault-unit-btn active" data-unit="oz">
              <span class="vault-unit-label">Ounces</span>
              <span class="vault-unit-abbr">oz</span>
            </button>
            <button type="button" id="popover-unit-ml" class="vault-unit-btn" data-unit="ml">
              <span class="vault-unit-label">Milliliters</span>
              <span class="vault-unit-abbr">ml</span>
            </button>
          </div>
        </div>

        <!-- Section: Glass Presentation Preference -->
        <div class="vault-section">
          <div class="vault-section-title">Glass Presentation</div>
          <div class="vault-unit-toggle" role="group" aria-label="Default glass view mode">
            <button type="button" id="popover-glass-layered" class="vault-unit-btn active" data-glass-mode="layered">
              <span class="vault-unit-label">Layered</span>
            </button>
            <button type="button" id="popover-glass-blended" class="vault-unit-btn" data-glass-mode="blended">
              <span class="vault-unit-label">Mixed</span>
            </button>
          </div>
        </div>

        <!-- Section: Actions & Portability -->
        <div class="vault-section">
          <div class="vault-section-title">Actions & Data</div>
          <div class="vault-actions-list">
            <button type="button" id="btn-popover-new-drink" class="vault-action-item vault-action-primary"
              title="Create a new cocktail recipe">
              <div class="vault-action-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </div>
              <div class="vault-action-meta">
                <span class="vault-action-label">New Cocktail</span>
                <span class="vault-action-sub">Create and save a custom recipe</span>
              </div>
            </button>

            <button type="button" id="btn-export-json" class="vault-action-item" title="Download recipes backup">
              <div class="vault-action-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </div>
              <div class="vault-action-meta">
                <span class="vault-action-label">Export Recipes</span>
                <span class="vault-action-sub">Download JSON backup</span>
              </div>
            </button>

            <button type="button" id="btn-import-trigger" class="vault-action-item" title="Import recipes from JSON">
              <div class="vault-action-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </div>
              <div class="vault-action-meta">
                <span class="vault-action-label">Import Recipes</span>
                <span class="vault-action-sub">Merge or restore from file</span>
              </div>
            </button>

            <button type="button" id="btn-reset-defaults" class="vault-action-item vault-action-danger"
              title="Restore default starter recipes">
              <div class="vault-action-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                  <path d="M3 3v5h5"></path>
                </svg>
              </div>
              <div class="vault-action-meta">
                <span class="vault-action-label">Reset Default Library</span>
                <span class="vault-action-sub">Restore original classics</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- <div class="vault-popover-footer">
        <span class="vault-badge-offline">Local-First Vault</span>
        <span class="vault-dot-sep">•</span>
        <span class="vault-footer-note">Offline Ready</span>
      </div> -->
    </div>


    <!-- Two-Pane Application Shell -->
    <main class="app-main">
      <!-- Left Pane: Sidebar & Recipe Navigation -->
      <aside class="sidebar" id="sidebar" aria-label="Cocktail library sidebar">
        <div class="sidebar-search-box">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="search-input" class="search-input"
              placeholder="Search drinks, spirits..." aria-label="Search recipes">
            <button id="search-clear-btn" class="btn btn-ghost search-clear-btn" aria-label="Clear search">✕</button>
          </div>
        </div>

        <!-- Themed Pack Filter Pills -->
        <div class="sidebar-pack-filter" id="sidebar-pack-filter" role="tablist" aria-label="Cocktail packs">
          <button type="button" class="pack-pill active" data-pack="all" role="tab" aria-selected="true">All</button>
          <button type="button" class="pack-pill" data-pack="classic" role="tab" aria-selected="false">Classic</button>
          <button type="button" class="pack-pill" data-pack="modern-craft" role="tab" aria-selected="false">
            Craft</button>
          <button type="button" class="pack-pill" data-pack="tropical-tiki" role="tab"
            aria-selected="false">Tiki</button>
          <button type="button" class="pack-pill" data-pack="prohibition-era" role="tab"
            aria-selected="false">Prohibition</button>
          <button type="button" class="pack-pill" data-pack="aperitivo-amaro" role="tab"
            aria-selected="false">Aperitivo</button>
          <button type="button" class="pack-pill" data-pack="nightcaps" role="tab"
            aria-selected="false">Nightcaps</button>
        </div>

        <!-- Inventory Filter Tabs -->
        <div class="sidebar-inventory-filter" id="sidebar-inventory-filter" role="tablist"
          aria-label="Inventory filter">
          <button class="inventory-filter-btn active" data-filter="all" role="tab" aria-selected="true">
            All <span class="filter-count" id="count-all">0</span>
          </button>
          <button class="inventory-filter-btn" data-filter="can_make" role="tab" aria-selected="false">
            Ready <span class="filter-count" id="count-can-make">0</span>
          </button>
        </div>

        <ul class="recipe-list" id="recipe-list" role="listbox" aria-label="Recipe List">
          <!-- Dynamically populated recipe cards -->
        </ul>

        <div class="sidebar-footer">
          <span id="recipe-count-badge">0 Cocktails</span>
        </div>
      </aside>

      <!-- Right Pane: Main Display Area -->
      <section class="main-stage" id="main-stage" aria-label="Recipe details and workspace">
        <!-- Home View Container -->
        <div id="home-view-container" class="home-view" style="display: none;">
          <!-- Rendered dynamically -->
        </div>

        <!-- Counter View Container -->
        <div id="counter-view-container" class="counter-view">
          <!-- Rendered dynamically -->
        </div>

        <!-- Recipe Editor View Container (Hidden initially) -->
        <div id="editor-view-container" class="editor-view" style="display: none;">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </main>

    <!-- Backbar Inventory Modal -->
    <dialog id="backbar-modal" class="backbar-dialog" closedby="any" aria-labelledby="backbar-modal-title">
      <div class="backbar-dialog-container">
        <div class="backbar-dialog-header">
          <div>
            <h2 id="backbar-modal-title" class="backbar-dialog-title">Personal Backbar</h2>
            <p class="backbar-dialog-subtitle">Select the bottles and bar staples you keep in stock.</p>
          </div>
          <button id="btn-close-backbar" class="btn btn-ghost btn-sm close-modal-btn"
            aria-label="Close modal">✕</button>
        </div>

        <div class="backbar-toolbar">
          <div class="search-input-wrapper backbar-search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="backbar-search-input" class="search-input"
              placeholder="Search bottles or ingredients..." aria-label="Search backbar items">
          </div>
          <div class="backbar-quick-actions">
            <button id="btn-starter-bar" class="btn btn-secondary btn-sm" title="Add essential bar staples">Starter
              Bar</button>
            <button id="btn-clear-bar" class="btn btn-ghost btn-sm" title="Clear all inventory bottles">Clear
              All</button>
          </div>
        </div>

        <!-- Category & Storage Filter Tabs -->
        <div class="backbar-nav-tabs" id="backbar-nav-tabs" role="tablist" aria-label="Filter backbar by category">
          <button type="button" class="backbar-nav-tab active" data-cat-filter="all" role="tab"
            aria-selected="true">All</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="spirits" role="tab"
            aria-selected="false">Spirits</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="fortified_wine" role="tab"
            aria-selected="false">Vermouth & Wines</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="liqueurs" role="tab"
            aria-selected="false">Liqueurs & Amari</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="bitters" role="tab"
            aria-selected="false">Bitters</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="sweeteners" role="tab"
            aria-selected="false">Syrups</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="produce" role="tab"
            aria-selected="false">Produce & Juices</button>
          <button type="button" class="backbar-nav-tab" data-cat-filter="mixers" role="tab"
            aria-selected="false">Mixers</button>
          <button type="button" class="backbar-nav-tab backbar-nav-tab-fridge" data-cat-filter="fridge" role="tab"
            aria-selected="false">
            <span class="fridge-icon">❄️</span> Refrigerated
          </button>
        </div>

        <div class="backbar-categories-container" id="backbar-categories-container">
          <!-- Dynamically populated taxonomy categories and bottle pills -->
        </div>

        <div class="backbar-dialog-footer">
          <span class="backbar-summary-text" id="backbar-summary-text">0 bottles in your backbar</span>
          <button id="btn-done-backbar" class="btn btn-primary btn-sm">Done</button>
        </div>
      </div>
    </dialog>

    <!-- Toast Notifications Area -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
  </div>

  <script type="module" src="app.js?v=13"></script>
</body>

</html>
